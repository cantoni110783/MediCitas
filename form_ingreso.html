<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Acceso | MediCitas</title>

    <link rel="stylesheet" href="styles/styles.css" />
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-card login-card" id="login">
        <div class="auth-header">
          <a href="index.html" class="logo">
            <span class="logo-icon">♥</span>
            <span class="logo-text">MediCitas</span>
          </a>

          <h1>Bienvenido de nuevo</h1>

          <p>
            Ingresa tus datos para acceder a tu cuenta y gestionar tus citas
            médicas.
          </p>
        </div>

        <form class="auth-form">
          <div class="form-group">
            <label for="login-email">Correo electrónico</label>
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="ejemplo@correo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="button" class="auth-button">Iniciar sesión</button>
        </form>

        <div class="auth-footer">
          <p>
            ¿Aún no tienes una cuenta?
            <a href="registro.html">Regístrate aquí</a>
          </p>
          <a href="index.html" class="back-home">← Volver al inicio</a>
        </div>
      </section>
    </main>
  </body>
</html>
